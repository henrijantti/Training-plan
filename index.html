,"squat":{"caution":"Token only","load":90,"reps":3,"sets":3},"wtd_pu":{"prescription":"Bodyweight AMRAP #3 FIRST (expect 12–13) → 3 × 3 @ +7.5"}},"session":"sun_legs_pull","sub":"Short pull ~35′ · token squat · no grinding"}],"gtg":"8–10","kcal":"2,000 — no food taper","name":"Training deload","rationale":{"body":"Training deloads; the diet does not. Thursday morning's sharpener is the only race rehearsal there will be — controlled at 4:06 and the 20:30 plan goes ahead, strained and the race opens at 4:10–4:12 for ~20:50. Saturday rehearses the opener. Nothing goes to failure anywhere this week.","eyebrow":"WHY THE HAY IS IN THE BARN"}},"21":{"actual":{"closed":false},"contingency":{"body":"Nothing is made up in test week. A missed session is a rested session — turn up on Friday fed and slept.","eyebrow":"IF SOMETHING GOES WRONG"},"dates":"Sep 21 – 27","days":[{"dow":"Mon","gym":"Last touch ~30′ · bench 3 × 2 @ 95–100, bar speed","kind":"lift","minutes":30,"overrides":{"bench":{"caution":"Bar speed only","load":"95–100","reps":2,"sets":3},"hang":{"prescription":"1 × 45 s, easy"},"lat_raise":"dropped","pushups":"dropped","wtd_pu":{"prescription":"3 × 3 @ +7.5"}},"session":"sat_bench","sub":"GtG stops today · pull-ups 3 × 3 · hang 1 × 45″"},{"dow":"Tue","kind":"run","minutes":30,"run":"Easy 20–30′ jog + 2–3 relaxed strides","sub":"Floorball skipped — two days before the scan"},{"dow":"Wed","kind":"rest","sub":"Mild low-sodium only if Sunday's fasted read was ≤ 86.0, otherwise skip and hydrate — never dehydrate","text":"Rest + mobility · scan-day prep"},{"details":[["Helsinki, fasted AM","the comp score"],["Refeed starts off the machine","~3,500–4,000"],["Carbs","450–600 g"],["Optional 10–15′ loosener","+ 2 strides"]],"dow":"Thu","kind":"other","note":"Mild management only — no dehydration. Every optical kilo is 1.375 kg less required on the bench and helps nothing else, and the tests still pay for real depletion.","run":"Optional 10–15′ loosener + 2 strides","sub":"~3,500–4,000 kcal · 450–600 g carbs · fluids all day","text":"Official InBody, fasted AM — then the refeed starts","title":"Official InBody, then eat"},{"details":[["Pull-ups max → dead hang max","comp order"],["Push-ups 2:00","60 target"],["Bench 112.5 → 118 → 121+","121+ if 118 ok"],["1 mile, last event","sub-6:30"],["Squat","pre-decided skip"]],"dow":"Fri","gym":"Test day — pull-ups, hang, push-ups, bench, then the mile","kind":"other","note":"At least 20–30′ after the push-ups, then a non-negotiable re-warm-up: 8–10′ jog and 2–3 strides at mile effort. Carbs steady all day, last full meal ~3 h before the lifts.","sub":"Bench ladder 112.5 banked → 118 → 121+ · squat skipped","title":"Test day — mile last"},{"details":[["Warm-up 12–15′ + 3 × 20–30″ strides","at race pace"],["Open 4:10–4:12","feels slow","ok"],["Lock 4:06–4:08 through 4 km","empty from 3.5"],["Comp bar","sub-22:00"]],"dow":"Sat","kind":"quality","note":"20:30 is 4:06/km average. Trust the even split — the comp bar is comfortable and the internal target is the race plan.","run":"5K RACE — the first measured 5K of the block","session":"run_rules","sub":"Open 4:10–4:12, lock 4:06–4:08, empty from 3.5 km","title":"5K race — the first measured 5K"},{"dow":"Sun","kind":"rest","text":"Complete rest · done"}],"gtg":"stop ~Sep 21","kcal":"2,000 → lighter carbs Wed → refeed from Thu","name":"Test week","rationale":{"body":"Nothing added this week can be earned and plenty can be lost, so Monday is bar speed only and the GtG reps stop. Thursday's scan sets the bench bar at 1.375 × the scan weight, which is why Wednesday is mild management only — every optical kilo is 1.375 kg off the bar and buys nothing else.","eyebrow":"WHY MONDAY IS THE LAST TOUCH"}}}}</script>
<script>
var P=JSON.parse(document.getElementById('plan').textContent);
var DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function dateOf(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function weekOf(d){var a=dateOf(P.block.reanchor.date),days=Math.round((d-a)/86400000);var w=P.block.reanchor.week+Math.floor(days/7);return Math.max(1,Math.min(P.block.weeks,w));}
function scanLabel(){var d=dateOf(P.block.test.scan);return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate();}
function daysToTest(d){return Math.max(0,Math.round((dateOf(P.block.test.scan)-d)/86400000));}
var TODAY=new Date();TODAY.setHours(0,0,0,0);var CURW=weekOf(TODAY);var DOW=DOWS[(TODAY.getDay()+6)%7];
document.title='Wk '+CURW+' / '+P.block.weeks+' — September Test';
var ENT={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ENT[c];});}
function num(v,dflt){var n=parseFloat(v);return isFinite(n)?n:dflt;}
function star(t){return String(t).replace(/★/g,'<span class="star">★</span>');}
var VIEWS=Object.create(null);var app=document.getElementById('app');var CURVIEW='home';var CURARG=null;
function navigate(view,arg,push){var st={view:view,arg:arg||null};if(push!==false)history.pushState(st,'','#'+view+(arg?'/'+arg:''));render(view,arg);}
function render(view,arg){CURVIEW=view;CURARG=arg||null;app.innerHTML=(VIEWS[view]||VIEWS.home)(arg);window.scrollTo(0,0);document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.v===((view==='session'||view==='sessions')?'program':view));});}
window.onpopstate=function(e){var s=e.state||{view:'home'};render(s.view,s.arg);};
function act(el){var ds=el.dataset;
  if(ds.act==='toggle-week'){toggleWeek(ds.w);return;}
  if(ds.act==='open-session'){openSession(ds.id);return;}
  if(ds.nav){navigate(ds.nav,ds.arg||null);return;}if(ds.v){navigate(ds.v);}}
function hit(e,sel){var t=e.target;return t&&t.closest?t.closest(sel):null;}
function wire(root,sel){
  root.addEventListener('click',function(e){var el=hit(e,sel);if(el)act(el);});
  root.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return;
    var el=hit(e,sel);if(!el||el.tagName==='BUTTON'||el.tagName==='A')return;e.preventDefault();act(el);});}
function phaseLabels(){var wks=num(P.block.weeks,0),out='',L=P.block.labels.slice();
  var last=L[L.length-1];if(last&&num(last.to,0)===wks&&num(last.to,0)-num(last.from,0)<2){var f=wks-2;if(L.length>1)L[L.length-2]=Object.assign({},L[L.length-2],{to:f-1});L[L.length-1]=Object.assign({},last,{from:f});}
  L.forEach(function(l){var f=num(l.from,1),t=num(l.to,1);var n=String(l.name);n=n.charAt(0)+n.slice(1).toLowerCase();
  out+='<span style="grid-column:'+f+' / '+(t+1)+(t===wks?';text-align:right':'')+'">'+esc(n)+'</span>';});return out;}
function ticks(){var n=num(P.block.weeks,0),out='';for(var w=1;w<=n;w++){out+='<i class="tick '+(w<CURW?'past':w===CURW?'current':'')+'"></i>';}return out;}
function week(n){return P.weeks[String(n)]||P.weeks[n]||null;}
function todayRow(w){return (w&&w.days||[]).filter(function(d){return d.dow===DOW;})[0]||null;}
function dayState(d){var i=DOW_I(d.dow),t=DOW_I(DOW);return i<t?'past':i===t?'today':'future';}
function DOW_I(x){return DOWS.indexOf(x);}
function fmtDate(d){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()].toUpperCase()+' '+d.getDate()+' '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];}
function hasMins(m){return m.live.some(function(e){return e.minutes!=null&&e.minutes!=='';});}
function dayMins(d){if(d&&d.session&&P.sessions[d.session]){var m=mergeSession(P.sessions[d.session],dayOverrides(d,d.session));
    if(hasMins(m))return m.minutes;}
  return d?d.minutes:null;}
var DISC_LBL={gym:'Gym',run:'Run',rest:'Rest'};
function disc(k){return '<span class="disc '+k+'" role="img" aria-label="'+DISC_LBL[k]+'"><svg aria-hidden="true"><use href="#i-'+k+'"/></svg></span>';}
function txtOf(v){return v==null?'':String(v);}
function dayRow(d,nx,dense){var st=nx?'future':dayState(d),mn=dayMins(d),right=(!nx&&st==='past')?'✓':(mn!=null?'~'+esc(mn)+'′':'—');
  var gym=txtOf(d.gym),run=txtOf(d.run),head=gym||txtOf(d.text),rm=d.run_minutes==null||d.run_minutes===''?'':'~'+esc(d.run_minutes)+'′';
  var L=[];if(head)L.push([gym?'gym':'rest',head]);if(run)L.push(['run',run]);if(!L.length)L.push(['rest','']);

function splitRx(s){s=String(s);var m=s.match(/^(.*?)\s+((?:[\d~][\d.,–\-]*\s*(?:kg|km|′|″|min)?\s*(?:×\s*)?)+[^a-zA-Z]*)$/);return m&&m[2].trim()?[m[1],m[2].trim()]:[s,''];}

function prescription(e){if(e.prescription!=null&&e.prescription!=='')return String(e.prescription);

function mergeSession(s,ov){ov=ov||{};var out={title:s.title,minutes:s.minutes,note:s.note,chips:(s.chips||[]).slice(),exercises:[]};
  (s.exercises||[]).forEach(function(e){var o=ov[e.id],x=Object.assign({},e);x.template=prescription(e);
